name: P-Bandai Issue Notify

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write # 必須要有寫入 Issue 的權限
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install puppeteer
      
      - name: Run Scraper
        id: scraper
        run: |
          # 執行爬蟲並捕捉輸出
          OUTPUT=$(node scrape.js)
          
          # 檢查是否有找到貨品
          if echo "$OUTPUT" | grep -q "FOUND_ITEMS_START"; then
            # 提取貨品清單文字
            CONTENT=$(echo "$OUTPUT" | sed -n '/FOUND_ITEMS_START/,/FOUND_ITEMS_END/p' | sed '1d;$d')
            
            # 使用 GitHub 的環境變數儲存多行文字
            {
              echo "items<<EOF"
              echo "$CONTENT"
              echo "EOF"
              echo "found=true"
            } >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Issue via GitHub Script
        if: steps.scraper.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `發現以下 MG / Metal Build 商品：\n\n${{ steps.scraper.outputs.items }}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `📢 P-Bandai 新貨預報: ${new Date().toISOString().split('T')[0]}`,
              body: body
            });
