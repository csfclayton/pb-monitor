name: Daily P-Bandai Check

on:
  schedule:
    - cron: '0 0 * * *' # 每天香港時間 08:00 執行
  workflow_dispatch: # 允許你手動按按鈕執行測試

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Run Scraper
        run: node scrape.js

      - name: Commit and Push CSV
        run: |
          git config --global user.name "PB-Bot"
          git config --global user.email "bot@github.com"
          git add pb_updates.csv
          git commit -m "Auto-update P-Bandai list" || echo "No changes to commit"
          git push
