name: Daily P-Bandai Telegram Notify

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install puppeteer
      - run: node scrape.js
      - name: Run Scraper
        run: node scrape.js
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}      # 從保險箱拎出來
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}  # 從保險箱拎出來
