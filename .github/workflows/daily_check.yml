name: Daily P-Bandai Check

on:
  schedule:
    - cron: '0 0 * * *' # 每天香港時間 08:00 執行
  workflow_dispatch: # 允許手動執行

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 確保有權限寫入檔案回到 GitHub
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4 # 升級到 v4 解決 Warning

      - name: Install Node.js
        uses: actions/setup-node@v4 # 升級到 v4 解決 Warning
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Run Scraper
        run: node scrape.js

      - name: Commit and Push CSV
        run: |
          # 1. 基本設定
          git config --global user.name "PB-Bot"
          git config --global user.email "bot@github.com"
          
          # 2. 先更新遠端資訊，確保知道最新的 commit
          git fetch origin main
          
          # 3. 檢查是否有變動
          git add pb_updates.csv
          if git diff --staged --quiet; then
            echo "沒有新商品，跳過 Commit"
          else
            # 4. 強制將遠端最新的改動合併進來 (使用策略解決衝突)
            git commit -m "Auto-update P-Bandai list: $(date)"
            git pull --rebase origin main
            git push origin main
          fi
