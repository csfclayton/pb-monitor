name: P-Bandai Debug Notify

on:
  workflow_dispatch: # 手動觸發測試

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install puppeteer
      
      - name: Run Scraper
        id: scraper
        run: |
          OUTPUT=$(node scrape.js)
          echo "$OUTPUT" # 喺 Log 印出嚟方便我哋睇
          
          # 提取內容
          if echo "$OUTPUT" | grep -q "FOUND_ITEMS_START"; then
            CONTENT=$(echo "$OUTPUT" | sed -n '/FOUND_ITEMS_START/,/FOUND_ITEMS_END/p' | sed '1d;$d')
            echo "items<<EOF" >> $GITHUB_OUTPUT
            echo "$CONTENT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "status=FOUND" >> $GITHUB_OUTPUT
          else
            # 如果無 MG，就拎 DEBUG 資訊
            DEBUG_INFO=$(echo "$OUTPUT" | grep -A 5 "DEBUG_FIRST_3_ITEMS" || echo "乜都搵唔到")
            echo "items<<EOF" >> $GITHUB_OUTPUT
            echo "今日無 MG/Metal Build。網頁頭幾件貨係："
            echo "$DEBUG_INFO"
            echo "EOF" >> $GITHUB_OUTPUT
            echo "status=NOT_FOUND" >> $GITHUB_OUTPUT
          fi

      - name: Create Result Issue
        uses: actions/github-script@v7
        with:
          script: |
            const status = "${{ steps.scraper.outputs.status }}";
            const title = status === 'FOUND' ? "🔥 發現 MG/Metal Build！" : "📭 今日巡邏完畢（無發現）";
            const body = `報告時間: ${new Date().toLocaleString('zh-HK')}\n\n${{ steps.scraper.outputs.items }}`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body
            });
